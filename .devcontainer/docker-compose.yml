services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ../..:/workspaces:cached

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: postgres:latest
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres

    # Add "forwardPorts": [5432] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  nginx:
    image: nginx:stable
    restart: unless-stopped
    volumes:
      - ../deploy/nginx/certs:/etc/nginx/certs:ro
      - ./nginx.conf:/etc/nginx/conf.d/pymitiveca.conf:ro

    # Ten sam namespace sieciowy co "app" i "db" - dzięki temu proxuje do
    # aplikacji pod localhost:8001 (patrz nginx.conf) bez dodatkowej
    # konfiguracji sieci. Wymaga wygenerowanych certów w deploy/nginx/certs/
    # (patrz deploy/README.md) - bez nich kontener nginx nie wystartuje.
    network_mode: service:db

    # Porty 80/443/8000 forwardowane przez "forwardPorts" w devcontainer.json.

volumes:
  postgres-data:
