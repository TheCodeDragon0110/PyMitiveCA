upstream pymitiveca_app {
    # W devcontainerze nginx dzieli namespace sieciowy z "db" (network_mode:
    # service:db, tak samo jak "app" - patrz docker-compose.yml), więc
    # aplikacja (manage.py runserver z postStartCommand) jest tu widoczna
    # pod localhost:8001, a nie pod nazwą usługi "app:8001" jak w
    # docker-compose.prod.yml.
    server 127.0.0.1:8001;
}

server {
    listen 80;
    listen 8000;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Transport GET protokołu OCSP (RFC 6960) niesie żądanie zakodowane
    # base64 wprost w ścieżce, a base64 może zawierać "//" - domyślne
    # sklejanie ukośników przez nginx uszkodziłoby takie żądanie.
    merge_slashes off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /ws/ {
        proxy_pass http://pymitiveca_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://pymitiveca_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
