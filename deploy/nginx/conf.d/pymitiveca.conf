upstream pymitiveca_app {
    server app:8001;
}

# Port 80 i 8000: przekierowanie na HTTPS + ścieżka na przyszłe wyzwania
# ACME (certbot). 8000 to port, pod którym historycznie / w devcontainerze
# bywa dostępna aplikacja bezpośrednio (patrz forwardPorts w
# .devcontainer/devcontainer.json) - tu też ma tylko przekierowywać,
# żeby nic nie odpowiadało po zwykłym HTTP.
server {
    listen 80;
    listen 8000;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Transport GET protokołu OCSP (RFC 6960) niesie żądanie zakodowane
    # base64 wprost w ścieżce, a base64 może zawierać "//" - domyślne
    # sklejanie ukośników przez nginx uszkodziłoby takie żądanie.
    merge_slashes off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Kanał WebSocket (Django Channels).
    location /ws/ {
        proxy_pass http://pymitiveca_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://pymitiveca_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
