services:
  db:
    image: postgres:latest
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres

  app:
    image: python:3.13-slim
    restart: unless-stopped
    working_dir: /app/PyMitiveCA
    volumes:
      - .:/app
    command: >
      bash -c "pip install --no-cache-dir -r /app/requirements.txt daphne &&
               python manage.py migrate &&
               daphne -b 0.0.0.0 -p 8001 PyMitiveCA.asgi:application"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,${DOMAIN:-localhost}"
      # Adres publikowany w wystawianych certyfikatach (rozszerzenia
      # Authority Information Access i CRL Distribution Points) - musi być
      # tym, pod którym klienci widzą responder OCSP i CRL.
      CA_BASE_URL: "https://${DOMAIN:-localhost}"
    depends_on:
      - db

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      - app

  # Do włączenia dopiero gdy komponent ma realną, publicznie wskazującą
  # domenę (patrz deploy/README.md, sekcja "Przejście na certbot").
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - ./deploy/certbot/www:/var/www/certbot
  #     - ./deploy/certbot/conf:/etc/letsencrypt
  #   entrypoint: >
  #     sh -c "certbot certonly --webroot -w /var/www/certbot
  #            -d ${DOMAIN} --email ${EMAIL} --agree-tos --no-eff-email"

volumes:
  postgres-data:
